services:
  postgres:
    image: postgres:16-alpine
    container_name: parking-system-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parking_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parking_password}
      POSTGRES_DB: ${POSTGRES_DB:-parking_system}
    ports:
      # Bound to loopback on purpose: without the explicit host address Docker
      # publishes on 0.0.0.0, which exposes the database to the whole LAN.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-parking_user} -d ${POSTGRES_DB:-parking_system}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
    driver: local
